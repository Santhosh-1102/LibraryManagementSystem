# Render Blueprint Specification (https://render.com)
services:
  - type: web
    name: library-management-system
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8085
      - key: DB_HOST
        fromDatabase:
          name: library-postgres-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: library-postgres-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: library-postgres-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: library-postgres-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: library-postgres-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

databases:
  - name: library-postgres-db
    databaseName: library_db
    user: library_user
    region: oregon
    plan: free

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Book Inventory Management - LibraryHub')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Book Inventory</h1>
                <p class="text-slate-500 text-sm mt-1">Manage catalog entries, update volumes, and configure book profiles</p>
            </div>
            <a href="/admin/books/add" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs shadow-md shadow-brand-500/20 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i>
                <span>Add New Book</span>
            </a>
        </div>

        <!-- Filter Bar -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Search -->
            <form action="/admin/books" method="get" class="flex items-center w-full md:w-96 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <i class="fa-solid fa-magnifying-glass text-slate-400 mr-2 text-sm"></i>
                <input type="text" name="search" th:value="${searchKeyword}" placeholder="Search inventory by title, author, ISBN..."
                       class="w-full bg-transparent border-0 text-sm focus:outline-none text-slate-800 placeholder-slate-400">
            </form>

            <!-- Category Filter Pills -->
            <div class="flex items-center gap-1.5 overflow-x-auto w-full md:w-auto">
                <a href="/admin/books" class="px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap"
                   th:classappend="${selectedCategory == 'All' and (searchKeyword == null or searchKeyword.isEmpty()) ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                    All
                </a>
                <a th:each="cat : ${categories}" th:href="@{'/admin/books?category=' + ${cat}}"
                   class="px-3 py-1.5 rounded-lg text-xs font-bold transition whitespace-nowrap"
                   th:classappend="${selectedCategory == cat ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}"
                   th:text="${cat}">
                    Cat
                </a>
            </div>
        </div>

        <!-- Inventory Table -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-[11px] uppercase font-bold text-slate-400 tracking-wider border-b border-slate-100">
                        <tr>
                            <th class="px-6 py-4">Cover &amp; Title</th>
                            <th class="px-6 py-4">ISBN</th>
                            <th class="px-6 py-4">Category</th>
                            <th class="px-6 py-4">Total Copies</th>
                            <th class="px-6 py-4">Available</th>
                            <th class="px-6 py-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="book : ${books}" class="hover:bg-slate-50/80 transition">
                            <td class="px-6 py-4">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-14 rounded-lg bg-slate-100 overflow-hidden flex-shrink-0 shadow-xs">
                                        <img th:if="${book.coverImageUrl != null and !book.coverImageUrl.isEmpty()}" th:src="${book.coverImageUrl}" class="w-full h-full object-cover">
                                        <div th:unless="${book.coverImageUrl != null and !book.coverImageUrl.isEmpty()}" class="w-full h-full flex items-center justify-center text-slate-300 text-xs">
                                            <i class="fa-solid fa-book"></i>
                                        </div>
                                    </div>
                                    <div>
                                        <a th:href="@{'/book/' + ${book.isbn}}" class="font-bold text-slate-900 text-xs sm:text-sm hover:text-brand-600 transition" th:text="${book.title}">Title</a>
                                        <div class="text-[11px] text-slate-400" th:text="${book.author}">Author</div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 font-mono text-xs text-slate-500" th:text="${book.isbn}">ISBN</td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700" th:text="${book.category}">
                                    Category
                                </span>
                            </td>
                            <td class="px-6 py-4 font-bold text-slate-700 text-xs" th:text="${book.totalQuantity} + ' units'">0</td>
                            <td class="px-6 py-4 font-bold text-xs">
                                <span th:if="${book.availableQuantity > 0}" class="text-emerald-600" th:text="${book.availableQuantity} + ' units'">0</span>
                                <span th:unless="${book.availableQuantity > 0}" class="text-rose-600">Out of Stock</span>
                            </td>
                            <td class="px-6 py-4 text-right">
                                <div class="inline-flex items-center space-x-2">
                                    <a th:href="@{'/admin/books/edit/' + ${book.isbn}}" class="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold transition">
                                        <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                                    </a>
                                    <form th:action="@{'/admin/books/delete/' + ${book.isbn}}" method="post" onsubmit="return confirm('Are you sure you want to delete this book? This action cannot be undone.');">
                                        <button type="submit" class="px-3 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg text-xs font-bold transition">
                                            <i class="fa-solid fa-trash mr-1"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:unless="${books != null and !books.isEmpty()}" class="p-12 text-center text-slate-400">
                <i class="fa-solid fa-book-skull text-4xl mb-3"></i>
                <p class="text-sm">No books found in inventory.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

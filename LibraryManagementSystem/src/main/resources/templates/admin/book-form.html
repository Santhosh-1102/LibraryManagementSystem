<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header(${isEdit ? 'Edit Book' : 'Add New Book'} + ' - LibraryHub')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full flex-grow">
        <a href="/admin/books" class="inline-flex items-center text-xs font-semibold text-slate-500 hover:text-brand-600 mb-6 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Inventory
        </a>

        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xl p-8 sm:p-10">
            <div class="flex items-center space-x-4 mb-8">
                <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl font-bold shadow-xs">
                    <i th:class="${isEdit ? 'fa-solid fa-pen-to-square' : 'fa-solid fa-book-medical'}"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight" th:text="${isEdit ? 'Modify Book Entry' : 'Add Book to Catalog'}">Form Title</h1>
                    <p class="text-xs text-slate-500 mt-0.5">Fill in the literary details and inventory volume</p>
                </div>
            </div>

            <!-- Form -->
            <form th:action="${isEdit ? '/admin/books/edit/' + book.isbn : '/admin/books/add'}" method="post" enctype="multipart/form-data" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="isbn" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">ISBN Number *</label>
                        <input type="text" id="isbn" name="isbn" th:value="${book.isbn}" th:readonly="${isEdit}" required placeholder="e.g. 978-0132350884"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition"
                               th:classappend="${isEdit ? 'bg-slate-100 cursor-not-allowed text-slate-500' : 'bg-slate-50 focus:bg-white'}">
                    </div>
                    <div>
                        <label for="title" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Book Title *</label>
                        <input type="text" id="title" name="title" th:value="${book.title}" required placeholder="Book Title"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="author" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Author(s) *</label>
                        <input type="text" id="author" name="author" th:value="${book.author}" required placeholder="Primary Author"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label for="category" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Category *</label>
                        <select id="category" name="category" required class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                            <option value="">-- Select Category --</option>
                            <option value="Technology" th:selected="${book.category == 'Technology'}">Technology</option>
                            <option value="Science" th:selected="${book.category == 'Science'}">Science</option>
                            <option value="History" th:selected="${book.category == 'History'}">History</option>
                            <option value="Fiction" th:selected="${book.category == 'Fiction'}">Fiction</option>
                            <option value="Education" th:selected="${book.category == 'Education'}">Education</option>
                            <option value="Business" th:selected="${book.category == 'Business'}">Business</option>
                            <option value="Philosophy" th:selected="${book.category == 'Philosophy'}">Philosophy</option>
                            <option value="Other" th:selected="${book.category == 'Other'}">Other</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="totalQuantity" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Total Copies in Inventory *</label>
                    <input type="number" id="totalQuantity" name="totalQuantity" th:value="${book.totalQuantity > 0 ? book.totalQuantity : 5}" min="1" max="1000" required
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                </div>

                <div class="border-t border-slate-100 pt-4">
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Book Cover Image</label>
                    <div class="space-y-3">
                        <input type="text" id="coverUrl" name="coverUrl" th:value="${book.coverImageUrl}" placeholder="Paste Image URL (https://...)"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                        <div class="text-[11px] text-slate-400 text-center uppercase tracking-wider font-bold">-- OR UPLOAD LOCAL IMAGE --</div>
                        <input type="file" id="imageFile" name="imageFile" accept="image/*"
                               class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100">
                    </div>
                </div>

                <div>
                    <label for="description" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Book Description / Synopsis</label>
                    <textarea id="description" name="description" rows="4" th:text="${book.description}" placeholder="Write a brief overview of the book..."
                              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-brand-500/25 transition text-sm">
                        <span th:text="${isEdit ? 'Update Book Record' : 'Save Book to Library'}">Submit</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Student Registration - LibraryHub')}"></head>
<body class="bg-gradient-to-tr from-slate-100 via-brand-50/30 to-indigo-50/40 text-slate-800 min-h-screen flex flex-col justify-between">

    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 my-8">
        <div class="w-full max-w-lg bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-200/80 p-8 sm:p-10 relative overflow-hidden">
            <!-- Top Gradient Accent -->
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-emerald-500 via-brand-500 to-indigo-500"></div>

            <div class="text-center mb-8">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-brand-600 text-white flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/30 text-2xl">
                    <i class="fa-solid fa-id-card"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Student Enrollment</h2>
                <p class="text-slate-500 text-sm mt-1">Create your library membership to start borrowing</p>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMessage}" class="p-4 mb-6 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center">
                <i class="fa-solid fa-circle-exclamation text-rose-500 text-base mr-3"></i>
                <span th:text="${errorMessage}">Error occurred</span>
            </div>

            <!-- Form -->
            <form th:action="@{/register}" method="post" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Student ID / Reg No *</label>
                        <input type="text" id="username" name="username" required placeholder="e.g. STU202601"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label for="fullName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Full Legal Name *</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="e.g. Alex Johnson"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@college.edu"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label for="phone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Phone Number</label>
                        <input type="text" id="phone" name="phone" placeholder="e.g. 9876543210"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="age" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Age</label>
                        <input type="number" id="age" name="age" min="12" max="100" value="20"
                               class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Account Password *</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required placeholder="Choose a password"
                                   class="w-full px-4 pr-10 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                                <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-brand-600 hover:from-emerald-500 hover:to-brand-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 transition duration-200 text-sm">
                        Complete Registration
                    </button>
                </div>
            </form>

            <p class="text-center text-xs text-slate-500 mt-6">
                Already registered?
                <a href="/login" class="font-bold text-brand-600 hover:underline">Sign in here</a>
            </p>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
        function togglePasswordVisibility() {
            const pass = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pass.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>

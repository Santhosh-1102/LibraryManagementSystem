<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: header(${book.title} + ' - LibraryHub')}"></head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <div th:replace="~{fragments/layout :: navbar}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full flex-grow">
        <a href="/catalog" class="inline-flex items-center text-xs font-semibold text-slate-500 hover:text-brand-600 mb-6 transition">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Repository Catalog
        </a>

        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xl overflow-hidden p-6 sm:p-10">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Cover Image Column -->
                <div class="md:col-span-1">
                    <div class="rounded-2xl overflow-hidden shadow-lg border border-slate-100 bg-slate-100 h-80 sm:h-96 relative">
                        <img th:if="${book.coverImageUrl != null and !book.coverImageUrl.isEmpty()}" th:src="${book.coverImageUrl}" th:alt="${book.title}" class="w-full h-full object-cover">
                        <div th:unless="${book.coverImageUrl != null and !book.coverImageUrl.isEmpty()}" class="w-full h-full flex flex-col items-center justify-center bg-slate-200 text-slate-400">
                            <i class="fa-solid fa-book-open text-6xl mb-2"></i>
                            <span class="text-xs font-bold text-slate-500">LibraryHub Volume</span>
                        </div>
                    </div>
                </div>

                <!-- Info Column -->
                <div class="md:col-span-2 flex flex-col">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-brand-50 text-brand-700 border border-brand-200" th:text="${book.category}">
                            Category
                        </span>
                        <span class="px-3 py-1 rounded-full text-xs font-bold"
                              th:classappend="${book.availableQuantity > 0 ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}">
                            <span th:if="${book.availableQuantity > 0}" th:text="${book.availableQuantity} + ' of ' + ${book.totalQuantity} + ' Available'">Status</span>
                            <span th:unless="${book.availableQuantity > 0}">Currently Checked Out</span>
                        </span>
                    </div>

                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight" th:text="${book.title}">Title</h1>
                    <p class="text-base text-slate-600 font-medium mt-1" th:text="'Written by ' + ${book.author}">Author</p>

                    <!-- Meta Badges -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 my-6 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                        <div>
                            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">ISBN Number</span>
                            <span class="text-xs font-mono font-bold text-slate-700" th:text="${book.isbn}">ISBN</span>
                        </div>
                        <div>
                            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Copies</span>
                            <span class="text-xs font-bold text-slate-700" th:text="${book.totalQuantity} + ' units'">0</span>
                        </div>
                        <div>
                            <span class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Loan Period</span>
                            <span class="text-xs font-bold text-slate-700">14 Days Standard</span>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-8">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Synopsis &amp; Overview</h3>
                        <p class="text-sm text-slate-600 leading-relaxed" th:text="${book.description}">Book summary...</p>
                    </div>

                    <!-- Borrow / Actions Button -->
                    <div class="mt-auto pt-6 border-t border-slate-100 flex items-center gap-4">
                        <div sec:authorize="hasRole('ROLE_STUDENT')">
                            <form th:if="${book.availableQuantity > 0}" th:action="@{'/student/borrow/' + ${book.isbn}}" method="post">
                                <button type="submit" class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-lg shadow-brand-500/25 transition flex items-center gap-2 text-sm">
                                    <i class="fa-solid fa-book-bookmark"></i>
                                    <span>Borrow This Book</span>
                                </button>
                            </form>
                            <button th:unless="${book.availableQuantity > 0}" disabled class="px-6 py-3 bg-slate-200 text-slate-400 rounded-xl font-bold cursor-not-allowed text-sm">
                                Currently Out of Stock
                            </button>
                        </div>

                        <div sec:authorize="hasRole('ROLE_ADMIN')">
                            <a th:href="@{'/admin/books/edit/' + ${book.isbn}}" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow transition text-sm">
                                <i class="fa-solid fa-pen-to-square mr-2"></i> Edit Book Details
                            </a>
                        </div>

                        <div sec:authorize="isAnonymous()">
                            <a href="/login" class="px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow transition text-sm">
                                Login as Student to Borrow
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #1cc88a;
        --secondary-color: #17a673;
        --accent-color: #36b9cc;
        --light-color: #f8f9fc;
        --dark-color: #5a5c69;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      body {
        background: linear-gradient(-45deg, #0f6848 0%, #1cc88a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
      }

      .registration-container {
        display: flex;
        width: 100%;
        max-width: 1000px;
        min-height: 600px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        animation: fadeIn 0.8s ease-out;
      }

      .graphic-side {
        flex: 1;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .graphic-side::before {
        content: '';
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        top: -150px;
        left: -150px;
      }

      .graphic-side::after {
        content: '';
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        bottom: -100px;
        right: -100px;
      }

      .graphic-content {
        z-index: 2;
        text-align: center;
        animation: slideInLeft 1s ease-out;
      }

      .graphic-content h2 {
        font-weight: 700;
        font-size: 28px;
        margin-bottom: 20px;
      }

      .graphic-content p {
        font-weight: 300;
        font-size: 16px;
        opacity: 0.9;
        max-width: 300px;
        margin: 0 auto;
        line-height: 1.5;
      }

      .student-icon {
        font-size: 100px;
        margin-bottom: 30px;
        color: rgba(255, 255, 255, 0.9);
        filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
      }

      .form-side {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px;
        animation: slideInRight 1s ease-out;
        overflow-y: auto;
        max-height: 600px;
      }

      .logo {
        margin-bottom: 20px;
        text-align: center;
      }

      .logo h1 {
        font-weight: 700;
        color: var(--primary-color);
        font-size: 32px;
      }

      .logo span {
        color: var(--secondary-color);
      }

      .form-container {
        width: 100%;
        max-width: 400px;
      }

      .form-title {
        text-align: center;
        margin-bottom: 20px;
      }

      .form-title h3 {
        font-weight: 600;
        color: var(--dark-color);
        font-size: 24px;
      }

      .input-group {
        margin-bottom: 18px;
        width: 100%;
      }

      .input-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
        color: var(--dark-color);
        padding-left: 5px;
        font-size: 14px;
        width: 100%;
      }

      .input-container {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }

      .form-control {
        width: 100%;
        padding: 12px 15px 12px 40px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.3s;
        background: #fff;
        height: 46px;
      }

      .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(28, 200, 138, 0.15);
      }

      .input-icon {
        position: absolute;
        left: 15px;
        color: var(--dark-color);
        font-size: 16px;
        transition: all 0.3s;
        z-index: 2;
      }

      .form-control:focus + .input-icon {
        color: var(--primary-color);
      }

      .password-toggle {
        position: absolute;
        right: 15px;
        cursor: pointer;
        color: var(--dark-color);
        font-size: 16px;
        transition: all 0.3s;
        z-index: 2;
      }

      .password-toggle:hover {
        color: var(--primary-color);
      }

      .btn-register {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 16px;
        width: 100%;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(28, 200, 138, 0.3);
        position: relative;
        overflow: hidden;
        margin-top: 15px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-register::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: all 0.5s;
      }

      .btn-register:hover::before {
        left: 100%;
      }

      .btn-register:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 20px rgba(28, 200, 138, 0.4);
      }

      /* Login button styles */
      .btn-login {
        background: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        width: 100%;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(78, 115, 223, 0.3);
        position: relative;
        overflow: hidden;
        margin-top: 15px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .btn-login::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: all 0.5s;
      }

      .btn-login:hover::before {
        left: 100%;
      }

      .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 20px rgba(78, 115, 223, 0.4);
        color: white;
        text-decoration: none;
      }

      .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: var(--dark-color);
        width: 100%;
      }

      .login-link a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s;
      }

      .login-link a:hover {
        color: var(--secondary-color);
        text-decoration: underline;
      }

      .floating-objects {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        overflow: hidden;
        z-index: 1;
      }

      .floating-object {
        position: absolute;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }

      .obj-1 {
        width: 50px;
        height: 50px;
        top: 20%;
        left: 20%;
        animation: float 15s infinite ease-in-out;
      }

      .obj-2 {
        width: 30px;
        height: 30px;
        top: 60%;
        left: 10%;
        animation: float 12s infinite ease-in-out;
        animation-delay: 1s;
      }

      .obj-3 {
        width: 40px;
        height: 40px;
        top: 40%;
        right: 20%;
        animation: float 18s infinite ease-in-out;
        animation-delay: 2s;
      }

      .alert {
        padding: 10px 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        animation: fadeIn 0.5s ease-out;
        display: flex;
        align-items: center;
        font-size: 14px;
        width: 100%;
      }

      .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .terms {
        margin-top: 15px;
        font-size: 12px;
        color: var(--dark-color);
        text-align: center;
        width: 100%;
      }

      .terms a {
        color: var(--primary-color);
        text-decoration: none;
      }

      .terms a:hover {
        text-decoration: underline;
      }

      /* Form grid for better alignment */
      .form-grid {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: 100%;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-50px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(50px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(10deg);
        }
        100% {
          transform: translateY(0) rotate(0deg);
        }
      }

      /* Responsive Design */
      @media (max-width: 900px) {
        .registration-container {
          flex-direction: column;
          max-width: 500px;
          min-height: auto;
        }

        .graphic-side {
          padding: 25px;
        }

        .student-icon {
          font-size: 70px;
          margin-bottom: 20px;
        }

        .graphic-content h2 {
          font-size: 24px;
        }

        .graphic-content p {
          max-width: 250px;
        }

        .form-side {
          padding: 25px 20px;
        }
      }

      @media (max-width: 480px) {
        .form-container {
          max-width: 100%;
        }

        .logo h1 {
          font-size: 28px;
        }

        .form-title h3 {
          font-size: 22px;
        }

        body {
          padding: 15px;
        }

        .input-group {
          margin-bottom: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="registration-container">
      <div class="graphic-side">
        <div class="floating-objects">
          <div class="floating-object obj-1"></div>
          <div class="floating-object obj-2"></div>
          <div class="floating-object obj-3"></div>
        </div>
        <div class="graphic-content">
          <i class="fas fa-user-graduate student-icon"></i>
          <h2>Student Registration</h2>
          <p>Create your student account to access courses, grades, and learning resources</p>
        </div>
      </div>

      <div class="form-side">
        <div class="logo">
          <h1>Student<span>Portal</span></h1>
        </div>
		


        <div class="form-container">
          <div class="form-title">
            <h3>Create Account</h3>
          </div>
                  <!-- studentregister.html -->
		<div th:if="${errorMessage}" style="color: red; font-weight: bold; margin-bottom: 10px;">
		    <p th:text="${errorMessage}"></p>
		</div>
          <form th:action="@{/student/sturegistration}" th:object="${studentbinding}" method="post">
            <div class="form-grid">
              <!-- Username Field -->
              <div class="input-group">
                <label for="username">Username</label>
                <div class="input-container">
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    th:field="*{username}"
                    placeholder="Choose a username"
                    required
                  />
                  <i class="fas fa-at input-icon"></i>
                </div>
              </div>

              <!-- Password Field -->
              <div class="input-group">
                <label for="password">Password</label>
                <div class="input-container">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    th:field="*{password}"
                    placeholder="Create a password"
                    required
                  />
                  <i class="fas fa-lock input-icon"></i>
                  <span class="password-toggle" onclick="togglePassword()">
                    <i class="fas fa-eye"></i>
                  </span>
                </div>
              </div>

              <!-- Email Field -->
              <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-container">
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    th:field="*{email}"
                    placeholder="Enter your email address"
                    required
                  />
                  <i class="fas fa-envelope input-icon"></i>
                </div>
              </div>

              <!-- Phone Field -->
              <div class="input-group">
                <label for="phone">Phone Number</label>
                <div class="input-container">
                  <input
                    type="tel"
                    class="form-control"
                    id="phone"
                    th:field="*{phone}"
                    placeholder="Enter your phone number"
                    required
                  />
                  <i class="fas fa-phone input-icon"></i>
                </div>
              </div>
            </div>

            <button type="submit" class="btn-register">
              <i class="fas fa-user-plus me-2"></i>Register
            </button>
          </form>

          <div class="login-link">
            Already have an account?
            <a th:href="@{/student/stulogin}">Login here</a>
          </div>

          <div class="terms">
            By registering, you agree to our <a href="#">Terms of Service</a> and
            <a href="#">Privacy Policy</a>.
          </div>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      function togglePassword() {
        const passwordField = document.getElementById('password');
        const toggleIcon = document.querySelector('.password-toggle i');

        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          toggleIcon.classList.remove('fa-eye');
          toggleIcon.classList.add('fa-eye-slash');
        } else {
          passwordField.type = 'password';
          toggleIcon.classList.remove('fa-eye-slash');
          toggleIcon.classList.add('fa-eye');
        }
      }
      document.addEventListener('DOMContentLoaded', function () {
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach((input, index) => {
          input.style.animation = `slideInRight 0.5s ease-out ${index * 0.1 + 0.5}s both`;
        });

        const button = document.querySelector('.btn-register');
        button.style.animation = `fadeIn 0.5s ease-out 0.8s both`;
      });
    </script>
  </body>
</html>

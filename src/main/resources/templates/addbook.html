<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            border: none;
        }
        .card-header {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 1.5rem;
        }
        .form-control:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 0.25rem rgba(108, 92, 231, 0.25);
        }
        .btn-primary {
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            border: none;
            padding: 0.7rem 2rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(45deg, #5649c5, #8a82e6);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }
        .form-label {
            font-weight: 600;
            color: #495057;
        }
        .input-icon {
            position: relative;
        }
        .input-icon i {
            position: absolute;
            left: 15px;
            top: 12px;
            color: #6c5ce7;
        }
        .input-icon input {
            padding-left: 40px;
        }
        .required-field::after {
            content: "*";
            color: #dc3545;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-10">
                <div class="card">
                    <div class="card-header text-center">
                        <h3><i class="fas fa-book me-2"></i>Add New Book</h3>
                    </div>
					
					<div th:if="${error}" style="color:red; margin-top:10px;">
						<p th:text="${error}"></p>
					</div>
                    <div class="card-body p-4">
                        <!-- Form with Thymeleaf attributes -->
                        <form th:action="@{/admin/books/addbooks}" th:object="${book}" method="post">
                            <!-- Title Field -->
                            <div class="mb-4">
                                <label for="title" class="form-label required-field">Title</label>
                                <div class="input-icon">
                                    <i class="fas fa-heading"></i>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" 
                                           placeholder="Enter book title" required>
                                </div>
                                <div class="form-text">Enter the full title of the book</div>
                            </div>
                            
                            <!-- Author Field -->
                            <div class="mb-4">
                                <label for="author" class="form-label required-field">Author</label>
                                <div class="input-icon">
                                    <i class="fas fa-user"></i>
                                    <input type="text" class="form-control" id="author" th:field="*{author}" 
                                           placeholder="Enter author name" required>
                                </div>
                                <div class="form-text">Enter the author's full name</div>
                            </div>
                            
                            <!-- ISBN Field -->
                            <div class="mb-4">
                                <label for="isbn" class="form-label required-field">ISBN</label>
                                <div class="input-icon">
                                    <i class="fas fa-barcode"></i>
                                    <input type="text" class="form-control" id="isbn" th:field="*{isbn}" 
                                           placeholder="Enter ISBN number" required>
                                </div>
                                <div class="form-text">Enter the 10 or 13-digit ISBN number</div>
                            </div>
                            
                            <!-- Buttons -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="#" class="btn btn-secondary me-md-2" onclick="history.back()">
                                    <i class="fas fa-times me-1"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-plus me-1"></i> Add Book
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students - Library Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin: auto;
            max-width: 1100px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #4a90e2;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover {
            background: #f1f7ff;
        }

        ul {
            margin: 0;
            padding-left: 18px;
        }

        .status-active {
            color: green;
            font-weight: bold;
        }

        .status-inactive {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>📚 View Students</h1>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Registered</th>
                    <th>Status</th>
                    <th>Borrowed Books</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.studentId}"></td>
                    <td th:text="${student.username}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.phone}"></td>
                    <td th:text="${#temporals.format(student.registrationDate, 'yyyy-MM-dd HH:mm')}"></td>
                    
                    <td>
                        <span th:if="${student.active}" class="status-active">Active</span>
                        <span th:if="${!student.active}" class="status-inactive">Inactive</span>
                    </td>

                    <td>
                        <ul>
                            <li th:each="borrow : ${student.borrows}">
                                <span th:text="${borrow.book.title}"></span> 
                                (Issued: <span th:text="${borrow.issueDate}"></span>,
                                Return: <span th:text="${borrow.returnDate}"></span>,
                                Status: <span th:text="${borrow.returned ? 'Returned' : 'Not Returned'}"></span>)
                            </li>
                        </ul>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>

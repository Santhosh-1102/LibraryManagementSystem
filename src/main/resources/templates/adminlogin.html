<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #4e73df;
        --secondary-color: #6f42c1;
        --accent-color: #36b9cc;
        --light-color: #f8f9fc;
        --dark-color: #5a5c69;
        --student-color: #1cc88a; /* New color for student elements */
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
      }

      body {
        background: linear-gradient(-45deg, #6a11cb 0%, #2575fc 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
      }

      .login-container {
        display: flex;
        width: 100%;
        max-width: 1000px;
        min-height: 550px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        animation: fadeIn 0.8s ease-out;
      }

      .graphic-side {
        flex: 1;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .graphic-side::before {
        content: '';
        position: absolute;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        top: -150px;
        left: -150px;
      }

      .graphic-side::after {
        content: '';
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        bottom: -100px;
        right: -100px;
      }

      .graphic-content {
        z-index: 2;
        text-align: center;
        animation: slideInLeft 1s ease-out;
      }

      .graphic-content h2 {
        font-weight: 700;
        font-size: 28px;
        margin-bottom: 20px;
      }

      .graphic-content p {
        font-weight: 300;
        font-size: 16px;
        opacity: 0.9;
      }

      .admin-icon {
        font-size: 100px;
        margin-bottom: 30px;
        color: rgba(255, 255, 255, 0.9);
        filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
      }

      .form-side {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        animation: slideInRight 1s ease-out;
      }

      .logo {
        margin-bottom: 30px;
        text-align: center;
      }

      .logo h1 {
        font-weight: 700;
        color: var(--primary-color);
        font-size: 32px;
      }

      .logo span {
        color: var(--secondary-color);
      }

      .form-container {
        width: 100%;
        max-width: 350px;
      }

      .form-title {
        text-align: center;
        margin-bottom: 30px;
      }

      .form-title h3 {
        font-weight: 600;
        color: var(--dark-color);
        font-size: 24px;
      }

      .input-group {
        margin-bottom: 25px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--dark-color);
        padding-left: 5px;
      }

      .input-container {
        position: relative;
        display: flex;
        align-items: center;
      }

      .form-control {
        width: 100%;
        padding: 15px 15px 15px 45px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s;
        background: #fff;
        height: 52px;
      }

      .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.15);
      }

      .input-icon {
        position: absolute;
        left: 15px;
        color: var(--dark-color);
        font-size: 18px;
        transition: all 0.3s;
        z-index: 2;
      }

      .form-control:focus + .input-icon {
        color: var(--primary-color);
      }

      .password-toggle {
        position: absolute;
        right: 15px;
        cursor: pointer;
        color: var(--dark-color);
        font-size: 18px;
        transition: all 0.3s;
        z-index: 2;
      }

      .password-toggle:hover {
        color: var(--primary-color);
      }

      .btn-login {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 18px;
        width: 100%;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(78, 115, 223, 0.3);
        position: relative;
        overflow: hidden;
        margin-top: 10px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn-login::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: all 0.5s;
      }

      .btn-login:hover::before {
        left: 100%;
      }

      .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 20px rgba(78, 115, 223, 0.4);
      }

      /* Student login button styles */
      .btn-student-login {
        background: linear-gradient(135deg, var(--student-color) 0%, #17a673 100%);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 16px;
        width: 100%;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(28, 200, 138, 0.3);
        position: relative;
        overflow: hidden;
        margin-top: 15px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .btn-student-login::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: all 0.5s;
      }

      .btn-student-login:hover::before {
        left: 100%;
      }

      .btn-student-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 20px rgba(28, 200, 138, 0.4);
        color: white;
        text-decoration: none;
      }

      .additional-links {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        font-size: 14px;
      }

      .additional-links a {
        color: var(--primary-color);
        text-decoration: none;
        transition: all 0.3s;
      }

      .additional-links a:hover {
        color: var(--secondary-color);
        text-decoration: underline;
      }

      .floating-objects {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        overflow: hidden;
        z-index: 1;
      }

      .floating-object {
        position: absolute;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }

      .obj-1 {
        width: 50px;
        height: 50px;
        top: 20%;
        left: 20%;
        animation: float 15s infinite ease-in-out;
      }

      .obj-2 {
        width: 30px;
        height: 30px;
        top: 60%;
        left: 10%;
        animation: float 12s infinite ease-in-out;
        animation-delay: 1s;
      }

      .obj-3 {
        width: 40px;
        height: 40px;
        top: 40%;
        right: 20%;
        animation: float 18s infinite ease-in-out;
        animation-delay: 2s;
      }

      .alert {
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        animation: fadeIn 0.5s ease-out;
      }

      .alert-error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      /* Divider style */
      .divider {
        display: flex;
        align-items: center;
        margin: 20px 0;
        color: var(--dark-color);
        font-size: 14px;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background-color: #e0e0e0;
      }

      .divider::before {
        margin-right: 10px;
      }

      .divider::after {
        margin-left: 10px;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-50px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(50px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes float {
        0% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(10deg);
        }
        100% {
          transform: translateY(0) rotate(0deg);
        }
      }

      /* Responsive Design */
      @media (max-width: 900px) {
        .login-container {
          flex-direction: column;
          max-width: 500px;
        }

        .graphic-side {
          padding: 30px;
        }

        .admin-icon {
          font-size: 70px;
          margin-bottom: 20px;
        }

        .graphic-content h2 {
          font-size: 24px;
        }
      }

      @media (max-width: 480px) {
        .form-container {
          max-width: 100%;
        }

        .additional-links {
          flex-direction: column;
          gap: 10px;
          align-items: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="graphic-side">
        <div class="floating-objects">
          <div class="floating-object obj-1"></div>
          <div class="floating-object obj-2"></div>
          <div class="floating-object obj-3"></div>
        </div>
        <div class="graphic-content">
          <i class="fas fa-user-shield admin-icon"></i>
          <h2>Admin Portal</h2>
          <p>Access your administration dashboard to manage your system</p>
        </div>
      </div>

      <div class="form-side">
        <div class="logo">
          <h1>Admin<span>Portal</span></h1>
        </div>

        <div class="form-container">
          <div class="form-title">
            <h3>Sign In to Dashboard</h3>
          </div>

          <!-- Error Message (Thymeleaf) -->
		  <div th:if="${error}" style="color:red; margin-top:10px;">
		      <p th:text="${error}"></p>
		  </div>

          <form th:action="@{/admin/adminlogin}" method="post">
            <div class="input-group">
              <label for="username">Username</label>
              <div class="input-container">
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  placeholder="Enter your username"
                  required
                />
                <i class="fas fa-user input-icon"></i>
              </div>
            </div>

            <div class="input-group">
              <label for="password">Password</label>
              <div class="input-container">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                />
                <i class="fas fa-lock input-icon"></i>
                <span class="password-toggle" onclick="togglePassword()">
                  <i class="fas fa-eye"></i>
                </span>
              </div>
            </div>

            <button type="submit" class="btn-login">
              <i class="fas fa-sign-in-alt me-2"></i>Admin Login
            </button>
          </form>

          <!-- Divider and Student Login Button -->
          <div class="divider">Or continue as</div>
          
          <a  th:href="@{/student/stulogin}" class="btn-student-login">
            <i class="fas fa-user-graduate me-2"></i>Student Login
          </a>

          <div class="additional-links">
            <a href="/admin/forgot-password" th:href="@{/admin/forgot-password}"
              ><i class="fas fa-key me-1"></i>Forgot Password?</a
            >
            <a href="/admin/register" th:href="@{/admin/register}"
              ><i class="fas fa-user-plus me-1"></i>Create Account</a
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      function togglePassword() {
        const passwordField = document.getElementById('password');
        const toggleIcon = document.querySelector('.password-toggle i');

        if (passwordField.type === 'password') {
          passwordField.type = 'text';
          toggleIcon.classList.remove('fa-eye');
          toggleIcon.classList.add('fa-eye-slash');
        } else {
          passwordField.type = 'password';
          toggleIcon.classList.remove('fa-eye-slash');
          toggleIcon.classList.add('fa-eye');
        }
      }

      // Add animation to form elements when page loads
      document.addEventListener('DOMContentLoaded', function () {
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach((input, index) => {
          input.style.animation = `slideInRight 0.5s ease-out ${index * 0.1 + 0.5}s both`;
        });

        const button = document.querySelector('.btn-login');
        button.style.animation = `fadeIn 0.5s ease-out 0.8s both`;
        
        const studentButton = document.querySelector('.btn-student-login');
        studentButton.style.animation = `fadeIn 0.5s ease-out 1s both`;
      });
    </script>
  </body>
</html>

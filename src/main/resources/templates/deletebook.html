<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Deletion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --danger: #e63946;
            --warning: #fca311;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .delete-container {
            max-width: 500px;
            width: 100%;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .card-header {
            background: var(--danger);
            color: white;
            text-align: center;
            padding: 25px;
            border-bottom: none;
        }
        
        .card-body {
            padding: 30px;
            text-align: center;
        }
        
        .warning-icon {
            font-size: 5rem;
            color: var(--danger);
            margin-bottom: 20px;
        }
        
        .btn {
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3);
        }
        
        .btn-secondary {
            background: #6c757d;
            border-color: #6c757d;
            box-shadow: 0 4px 10px rgba(108, 117, 125, 0.3);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        .consequences {
            background-color: #ffeaea;
            border-radius: 10px;
            padding: 15px;
            margin: 25px 0;
            border-left: 4px solid var(--danger);
        }
        
        .consequences h6 {
            color: #721c24;
            margin-bottom: 10px;
        }
        
        .consequences p {
            color: #721c24;
            margin-bottom: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="delete-container">
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-exclamation-triangle me-2"></i>Confirm Deletion</h3>
            </div>
            <div class="card-body">
                <!-- Animation -->
                <div class="pulse">
                    <i class="fas fa-trash-alt warning-icon"></i>
                </div>
                
                <h4>Are you sure you want to delete this book?</h4>
                <p class="text-muted">This action cannot be undone.</p>
                
                <!-- Consequences Warning -->
                <div class="consequences">
                    <h6><i class="fas fa-exclamation-circle me-2"></i>Important Notice</h6>
                    <p>This will permanently remove the book from the library system. All associated data will be deleted.</p>
                </div>
                
                <!-- Delete Form -->
				<form th:action="@{/admin/books/delete/{id}(id=${id})}" method="post">
				    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
				        <a th:href="@{/admin/books/fetchallbooks}" class="btn btn-secondary me-md-3">
				            <i class="fas fa-times me-2"></i>Cancel
				        </a>
				        <button type="submit" class="btn btn-danger">
				            <i class="fas fa-trash me-2"></i>Confirm Delete
				        </button>
				    </div>
				</form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
